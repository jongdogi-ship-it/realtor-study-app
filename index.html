      { id: 'q-hak-9', subjectId: 'hak', q: '감정평가 3방식 중 수익방식에 속하는 평가방법에는 수익환원법과 적산법이 있다.', a: false, exp: '적산법은 원가방식(임료)에 속하며, 수익방식에는 "수익환원법"(가액)과 "수익분석법"(임료)이 속합니다.' },
      { id: 'q-hak-10', subjectId: 'hak', q: '시산가액 조정이란 감정평가 3방식에 의해 산출된 각각의 시산가액을 단순 산술평균하여 최종 감정평가액을 결정하는 작업이다.', a: false, exp: '시산가액 조정은 단순 산술평균하는 것이 아니라, 대상물건의 특성과 각 평가방식의 적정성 등을 고려해 가중치를 두어 조정하는 작업입니다.' },
      { id: 'q-hak-11', subjectId: 'hak', q: '거미집 이론에서 수요의 가격탄력성이 공급의 가격탄력성보다 크면 시간의 경과에 따라 균형으로 접근하는 수렴형이 된다.', a: true, exp: '수요탄력성 > 공급탄력성("수탄수")이면 파동이 점차 줄어들며 균형으로 수렴합니다.' },
      { id: 'q-hak-12', subjectId: 'hak', q: '리카도의 차액지대설에 의하면 비옥도가 가장 낮은 한계지(최열등지)에서도 토지 소유라는 이유만으로 절대지대가 발생한다.', a: false, exp: '한계지에서도 지대가 발생한다고 본 학자는 "마르크스(절대지대설)"이며, 리카도의 차액지대설에서는 한계지에 지대가 발생하지 않습니다.' },

      // 2. 민법 및 민사특별법 (12)
      { id: 'q-min-1', subjectId: 'min', q: '진의 아닌 의사표시(비진의표시)는 원칙적으로 무효이나, 상대방이 선의이며 과실이 없는 경우에 한하여 유효하다.', a: false, exp: '비진의표시는 원칙적으로 표시된 대로 "유효"하며, 예외적으로 상대방이 표의자의 진의 아님을 알았거나(악의) 알 수 있었을 경우(과실)에 "무효"가 됩니다.' },
      { id: 'q-min-2', subjectId: 'min', q: '통정허위표시의 무효는 선의의 제3자에게 대항하지 못하며, 이때 제3자는 선의이기만 하면 무과실까지 요구되지는 않는다.', a: true, exp: '통정허위표시에서 제3자는 선의면 보호받으며 무과실은 요건이 아닙니다. 또한 제3자의 선의는 추정됩니다.' },
      { id: 'q-min-3', subjectId: 'min', q: '무권대리행위에서 상대방이 상당한 기간을 정하여 본인에게 추인 여부의 확답을 최고하였으나 본인이 기간 내에 확답을 발하지 아니한 때에는 추인한 것으로 본다.', a: false, exp: '본인이 기간 내에 확답을 발하지 아니한 때에는 추인을 "거절한 것"으로 봅니다(민법 제131조).' },
      { id: 'q-min-4', subjectId: 'min', q: '무권대리 계약을 체결한 상대방은 계약 당시 대리권 없음을 알았더라도(악의) 본인의 추인이 있기 전에는 계약을 철회할 수 있다.', a: false, exp: '최고권은 선의·악의 불문하고 인정되지만, "철회권"은 계약 당시 대리권 없음을 알지 못한 "선의의 상대방"에게만 인정됩니다.' },
      { id: 'q-min-5', subjectId: 'min', q: '상속, 공용징수, 경매로 인한 부동산 물권의 취득은 등기를 요하지 아니하나, 이를 처분하려면 먼저 등기를 하여야 한다.', a: true, exp: '민법 제187조에 따라 등기 없이 물권을 취득하더라도 이를 타인에게 처분하려면 먼저 자기 명의로 등기를 해야 합니다.' },
      { id: 'q-min-6', subjectId: 'min', q: '점유취득시효의 완성으로 인한 부동산 소유권의 취득은 법률의 규정에 의한 물권변동이므로 등기 없이도 소유권을 취득한다.', a: false, exp: '민법 제245조 제1항에 따라 점유취득시효 완성으로 인한 소유권 취득은 예외적으로 "등기"를 하여야 소유권을 취득합니다.' },
      { id: 'q-min-7', subjectId: 'min', q: '동시이행의 항변권이 붙어 있는 채무는 이행기가 도과하더라도 이행지체 책임을 지지 않는다.', a: true, exp: '동시이행항변권의 존재효에 의해 상대방이 이행제공을 하지 않는 한 이행기가 지나도 이행지체 책임을 면합니다.' },
      { id: 'q-min-8', subjectId: 'min', q: '주택임대차보호법상 임차인이 주택의 인도와 주민등록을 마친 때에는 그 날의 정오(낮 12시)부터 제3자에 대하여 효력이 생긴다.', a: false, exp: '주택의 인도와 주민등록(전입신고)을 마친 "그 다음 날 오전 0시"부터 제3자에 대하여 대항력이 발생합니다.' },
      { id: 'q-min-9', subjectId: 'min', q: '소액임차인의 최우선변제권이 인정되기 위해서는 경매신청등기 전까지 대항요건(인도+주민등록) 외에 임대차계약서상의 확정일자까지 갖추어야 한다.', a: false, exp: '최우선변제권은 경매개시결정 등기 전까지 대항요건(주택 인도+주민등록)만 갖추면 인정되며, "확정일자"는 요건이 아닙니다.' },
      { id: 'q-min-10', subjectId: 'min', q: '주택임대차가 묵시적으로 갱신된 경우 존속기간은 2년으로 보며, 임차인은 언제든지 임대인에게 계약해지를 통지할 수 있고 통지받은 날부터 3개월이 지나면 효력이 발생한다.', a: true, exp: '묵시적 갱신 시 임대인은 2년간 구속되지만, 임차인은 언제든 해지 통지를 할 수 있으며 임대인이 통지받은 날부터 3개월 후 해지 효력이 발생합니다.' },
      { id: 'q-min-11', subjectId: 'min', q: '공유물을 임대하는 관리행위는 공유자 전원의 동의가 있어야 하지만, 공유지분의 처분은 각 공유자가 단독으로 자유롭게 할 수 있다.', a: false, exp: '공유물의 "처분·변경"이 전원 동의이고, 임대와 같은 "관리행위"는 공유지분의 "과반수"로 결정합니다.' },
      { id: 'q-min-12', subjectId: 'min', q: '반사회질서 법률행위(민법 제103조)에 해당하는 이중매매의 무효는 선의의 제3자에게는 대항하지 못한다.', a: false, exp: '반사회질서 법률행위의 무효는 "절대적 무효"이므로 선의의 제3자에게도 무효를 주장할 수 있습니다.' },

      // 3. 공인중개사법령 및 실무 (12)
      { id: 'q-jung-1', subjectId: 'jung', q: '장래에 건축될 특정한 동·호수가 지정된 아파트 분양권은 공인중개사법상 중개대상물에 해당한다.', a: true, exp: '장래 건축될 건물이라도 특정 동·호수가 지정된 분양권은 건축물로서 중개대상물에 해당합니다(반면 동·호수 미지정 입주권은 중개대상물 X).' },
      { id: 'q-jung-2', subjectId: 'jung', q: '영업용 건물의 영업시설·비품 등 유형물이나 거래처·신용·영업상의 노하우 등 재산적 가치(권리금)의 양도에 관한 알선은 중개대상물에 해당한다.', a: false, exp: '대법원 판례상 권리금은 중개대상물이 아니므로, 권리금 알선 대가에 대해서는 공인중개사법상 중개보수 한도 규정이 적용되지 않습니다.' },
      { id: 'q-jung-3', subjectId: 'jung', q: '도로교통법을 위반하여 500만 원의 벌금형을 선고받고 3년이 지나지 아니한 자는 중개사무소 개설등록의 결격사유에 해당한다.', a: false, exp: '벌금형 결격사유는 오직 "이 법(공인중개사법)"을 위반하여 300만 원 이상의 벌금형을 선고받은 경우에만 해당합니다.' },
      { id: 'q-jung-4', subjectId: 'jung', q: '전속중개계약의 유효기간은 당사자 간에 다른 약정이 없는 경우에는 6개월로 한다.', a: false, exp: '전속중개계약의 유효기간은 원칙적으로 "3개월"이며, 당사자 간 다른 약정이 있는 경우에는 그 약정에 따릅니다.' },
      { id: 'q-jung-5', subjectId: 'jung', q: '전속중개계약을 체결한 개업공인중개사는 중개의뢰인이 비공개를 요청한 경우에도 7일 이내에 부동산거래정보망에 중개대상물 정보를 공개해야 한다.', a: false, exp: '중개의뢰인이 비공개를 요청한 경우에는 이를 공개하여서는 "아니 됩니다"(절대 비공개 의무).' },
      { id: 'q-jung-6', subjectId: 'jung', q: '개업공인중개사는 중개대상물 확인·설명서를 작성하여 거래당사자 쌍방에게 교부하고 그 원본·사본 또는 전자문서를 5년간 보존하여야 한다.', a: false, exp: '확인·설명서의 보존기간은 "3년"이며, 거래계약서의 보존기간이 "5년"입니다.' },
      { id: 'q-jung-7', subjectId: 'jung', q: '소속공인중개사가 당해 중개행위를 한 경우, 중개대상물 확인·설명서에는 개업공인중개사와 당해 소속공인중개사가 함께 서명 및 날인하여야 한다.', a: true, exp: '당해 중개행위를 한 소속공인중개사가 있는 경우에는 개업공인중개사와 소속공인중개사가 함께 서명 "및" 날인해야 합니다.' },
      { id: 'q-jung-8', subjectId: 'jung', q: '개업공인중개사가 거래계약서를 작성·교부한 경우 부동산 거래신고는 거래당사자와 개업공인중개사가 공동으로 신고하여야 한다.', a: false, exp: '개업공인중개사가 거래계약서를 작성·교부한 때에는 반드시 "개업공인중개사"가 신고해야 합니다(거래당사자 신고 의무 면제).' },
      { id: 'q-jung-9', subjectId: 'jung', q: '부동산 매매계약을 체결한 경우 거래계약 체결일로부터 30일 이내에 부동산 소재지 관할 신고관청에 부동산 거래신고를 하여야 한다.', a: true, exp: '부동산 거래신고 기한은 계약 체결일로부터 30일 이내이며, 계약 해제·무효·취소 확정 시에도 확정일로부터 30일 이내에 신고해야 합니다.' },
      { id: 'q-jung-10', subjectId: 'jung', q: '분사무소 설치신고는 분사무소 소재지 관할 시장·군수·구청장에게 하여야 한다.', a: false, exp: '분사무소 설치신고는 분사무소 소재지가 아니라 "주된 사무소 소재지" 관할 등록관청에 하여야 합니다.' },
      { id: 'q-jung-11', subjectId: 'jung', q: '법인인 개업공인중개사의 업무보증 설정금액은 4억 원 이상이며, 분사무소를 두는 경우에는 분사무소마다 2억 원 이상을 추가로 설정해야 한다.', a: true, exp: '법인은 4억 원 이상(분사무소마다 +2억 원 이상), 개인 개업공인중개사는 2억 원 이상의 보증을 설정해야 합니다.' },
      { id: 'q-jung-12', subjectId: 'jung', q: '주거용 요건을 충족한 오피스텔(전용면적 85㎡ 이하)의 매매 중개보수 상한은 거래금액의 1천분의 5(0.5%)이다.', a: true, exp: '주거용 오피스텔 중개보수 상한은 매매·교환 0.5%(1천분의 5), 임대차 등 0.4%(1천분의 4)입니다.' },

      // 4. 부동산공법 (12)
      { id: 'q-gong-1', subjectId: 'gong', q: '국토의 계획 및 이용에 관한 법률상 용도지역은 토지의 이용실태 및 특성 등을 고려하여 서로 중복하여 지정할 수 있다.', a: false, exp: '용도지역(도시·관리·농림·자연환경보전지역)은 서로 중복되지 아니하게 도시·군관리계획으로 결정합니다(용도지구는 중복 지정 가능).' },
      { id: 'q-gong-2', subjectId: 'gong', q: '관리지역은 보전관리지역, 생산관리지역, 계획관리지역으로 세분되며, 이 중 도시지역으로의 편입이 예상되는 지역은 계획관리지역이다.', a: true, exp: '계획관리지역은 도시지역으로의 편입이 예상되는 지역이거나 자연환경을 고려하여 제한적인 이용·개발을 하려는 지역입니다.' },
      { id: 'q-gong-3', subjectId: 'gong', q: '녹지지역·관리지역 또는 자연환경보전지역에 물건을 1개월 이상 쌓아놓는 행위는 개발행위허가의 대상이다.', a: true, exp: '녹지·관리·자연환경보전지역 안에 울타리 안이 아닌 곳에 물건을 1개월 이상 쌓아놓는 행위는 개발행위허가 대상입니다.' },
      { id: 'q-gong-4', subjectId: 'gong', q: '경작을 위한 토지의 형질변경은 특별시장·광역시장·특별자치시장·특별자치도지사·시장 또는 군수의 개발행위허가를 받아야 한다.', a: false, exp: '경작을 위한 토지의 형질변경(조성된 농지에서의 농작물 재배, 밭을 논으로 바꾸는 행위 등)은 개발행위허가를 받지 않고 할 수 있습니다.' },
      { id: 'q-gong-5', subjectId: 'gong', q: '도시개발조합을 설립하려면 도시개발구역의 토지면적 3분의 2 이상에 해당하는 토지소유자와 그 구역의 토지소유자 총수의 2분의 1 이상의 동의를 받아야 한다.', a: true, exp: '도시개발조합 설립 인가 신청 시 동의요건은 "면적 2/3 이상 + 총수 1/2 이상"입니다.' },
      { id: 'q-gong-6', subjectId: 'gong', q: '도시 및 주거환경정비법상 재건축사업의 조합원은 토지등소유자 전원이 강제로 가입되며, 재개발사업의 조합원은 사업에 동의한 자로만 구성된다.', a: false, exp: '반대입니다! "재개발사업"은 토지등소유자 전원이 강제가입(동의 불요)이고, "재건축사업"은 사업에 동의한 자만 조합원이 됩니다.' },
      { id: 'q-gong-7', subjectId: 'gong', q: '정비기반시설은 양호하나 노후·불량건축물에 해당하는 공동주택이 밀집한 지역에서 주거환경을 개선하기 위하여 시행하는 사업은 재건축사업이다.', a: true, exp: '기반시설 양호 + 공동주택 밀집 = 재건축사업 / 기반시설 열악 = 재개발사업입니다.' },
      { id: 'q-gong-8', subjectId: 'gong', q: '건축법상 건축물의 대지는 원칙적으로 2미터 이상이 도로(자동차만의 통행에 사용되는 도로는 제외)에 접하여야 한다.', a: true, exp: '건축법 제44조(대지와 도로의 관계)에 따라 대지는 원칙적으로 2미터 이상이 도로에 접해야 합니다.' },
      { id: 'q-gong-9', subjectId: 'gong', q: '주택법상 투기과열지구는 국토교통부장관 또는 시·도지사가 지정할 수 있다.', a: true, exp: '투기과열지구와 조정대상지역은 국토교통부장관 또는 시·도지사가 지정·해제할 수 있습니다.' },
      { id: 'q-gong-10', subjectId: 'gong', q: '농지법상 주말·체험영농을 하려는 자는 농업인이 아니더라도 세대원 전부가 소유하는 총면적이 1,000제곱미터 미만인 농지를 소유할 수 있다.', a: true, exp: '비농업인이라도 주말·체험영농 목적으로는 세대당 1,000㎡ 미만까지 농지 소유가 가능합니다(단, 농업진흥지역 외 농지에 한함).' },
      { id: 'q-gong-11', subjectId: 'gong', q: '개발밀도관리구역과 기반시설부담구역은 기반시설의 원활한 설치를 위해 동일한 지역에 중복하여 지정할 수 있다.', a: false, exp: '개발밀도관리구역(건폐율·용적률 강화)과 기반시설부담구역(설치비용 부과)은 서로 중복하여 지정할 수 없습니다.' },
      { id: 'q-gong-12', subjectId: 'gong', q: '도시 및 주거환경정비법상 소유권 이전고시가 있은 때에는 분양받을 자는 이전고시가 있은 날 당일에 대지 또는 건축물의 소유권을 취득한다.', a: false, exp: '소유권 이전고시가 있은 날의 "다음 날"에 대지 또는 건축물의 소유권을 취득합니다.' },

      // 5. 부동산공시법 (12)
      { id: 'q-gongsi-1', subjectId: 'gongsi', q: '지적도 및 임야도에 지목을 부호로 표기할 때 주차장, 공장용지, 하천, 유원지는 첫 글자(두문자)가 아닌 두 번째 글자(차문자)로 표기한다.', a: true, exp: '지목 부호 표기에서 차문자를 쓰는 4가지는 "차(주차장)·장(공장용지)·천(하천)·원(유원지)"입니다.' },
      { id: 'q-gongsi-2', subjectId: 'gongsi', q: '공유수면 매립 등으로 새로 조성된 토지를 지적공부에 처음 등록하는 신규등록의 경우 지적소관청은 지체 없이 관할 등기관서에 등기를 촉탁하여야 한다.', a: false, exp: '신규등록 대상 토지는 아직 등기부 자체가 존재하지 않으므로 지적소관청이 관할 등기관서에 "등기촉탁을 하지 아니합니다".' },
      { id: 'q-gongsi-3', subjectId: 'gongsi', q: '임야대장 및 임야도에 등록된 토지를 토지대장 및 지적도로 옮겨 등록하는 것을 등록전환이라 하며, 토지소유자는 사유 발생일부터 60일 이내에 신청하여야 한다.', a: true, exp: '신규등록, 등록전환, 분할(형질변경 등 사유 발생 시) 모두 토지소유자가 사유 발생일부터 60일 이내에 신청해야 합니다.' },
      { id: 'q-gongsi-4', subjectId: 'gongsi', q: '토지의 합병은 원칙적으로 토지소유자의 신청의무가 없으나, 주택법에 따른 공동주택의 부지 등 대통령령으로 정하는 토지는 합병사유 발생일부터 60일 이내에 신청하여야 한다.', a: true, exp: '공동주택 부지, 도로·제방·하천·구거·유지·공장용지·학교용지 등 12개 지목·토지는 60일 이내 합병 신청 의무가 있습니다.' },
      { id: 'q-gongsi-5', subjectId: 'gongsi', q: '미등기 건물의 소유권보존등기는 등기권리자와 등기의무자가 공동으로 신청하여야 한다.', a: false, exp: '소유권보존등기는 등기의무자가 존재하지 않으므로 등기권리자가 "단독"으로 신청합니다.' },
      { id: 'q-gongsi-6', subjectId: 'gongsi', q: '유증(유언으로 인한 증여)을 원인으로 한 소유권이전등기는 수증자가 단독으로 신청하여야 한다.', a: false, exp: '상속은 단독신청이지만, "유증"은 유언집행자(등기의무자)와 수증자(등기권리자)가 "공동"으로 신청해야 합니다.' },
      { id: 'q-gongsi-7', subjectId: 'gongsi', q: '소유권이전등기는 주등기로 실행하지만, 전세권이나 저당권의 이전등기는 부기등기로 실행한다.', a: true, exp: '소유권 이전은 주등기, 소유권 외의 권리(전세권·저당권 등)의 이전등기는 순위 유지를 위해 부기등기로 합니다.' },
      { id: 'q-gongsi-8', subjectId: 'gongsi', q: '가등기에 기하여 본등기를 한 경우, 물권변동의 효력은 가등기를 한 때로 소급하여 발생한다.', a: false, exp: '본등기의 "순위"는 가등기 순위에 의하지만(순위보전효), 물권변동의 "효력"은 본등기를 한 때에 발생하며 가등기 시로 소급하지 않습니다.' },
      { id: 'q-gongsi-9', subjectId: 'gongsi', q: '가등기 후 본등기 전에 제3자 명의로 경료된 소유권이전등기 등 가등기와 양립할 수 없는 중간처분 등기는 등기관이 직권으로 말소한다.', a: true, exp: '가등기에 기한 본등기를 실행하면 가등기 이후 본등기 전에 행해진 양립 불가 등기는 등기관이 직권말소합니다.' },
      { id: 'q-gongsi-10', subjectId: 'gongsi', q: '등기관의 처분에 이의가 있는 자는 이의신청을 할 수 있으며, 이의신청에는 집행정지의 효력이 있다.', a: false, exp: '부동산등기법상 이의신청에는 "집행정지의 효력이 없습니다"(등기관 처분의 집행을 정지시키지 못함).' },
      { id: 'q-gongsi-11', subjectId: 'gongsi', q: '공유지분 위에는 저당권을 설정할 수 있지만, 지상권이나 전세권과 같은 용익물권은 설정할 수 없다.', a: true, exp: '공유지분에는 소유권이전·저당권 설정은 가능하나, 부동산 일부를 사용·수익하는 용익물권(지상권·지역권·전세권)과 임차권은 설정할 수 없습니다.' },
      { id: 'q-gongsi-12', subjectId: 'gongsi', q: '토지의 합병이나 지목변경을 할 때에는 경계나 면적이 새로 정해지므로 반드시 지적측량을 실시하여야 한다.', a: false, exp: '합병과 지목변경은 경계선만 없애거나 용도 명칭만 바꾸는 것이므로 면적 측정(지적측량)을 하지 않습니다.' },

      // 6. 부동산세법 (12)
      { id: 'q-se-1', subjectId: 'se', q: '지방세법상 취득세는 부동산을 취득한 자가 관계 법령에 따른 등기·등록을 이행하지 아니한 경우라도 사실상 취득하면 각각 취득한 것으로 본다.', a: true, exp: '취득세는 실질과세 원칙(사실상 취득주의)을 채택하여 등기·등록 여부와 관계없이 사실상 취득하면 과세합니다.' },
      { id: 'q-se-2', subjectId: 'se', q: '유상승계취득으로 부동산을 취득한 경우(상속 제외) 취득일로부터 60일 이내에 취득세를 신고하고 납부하여야 한다.', a: true, exp: '매매·증여 등 일반적인 취득세 신고·납부기한은 취득일로부터 60일 이내입니다(상속은 상속개시일이 속하는 달의 말일부터 6개월).' },
      { id: 'q-se-3', subjectId: 'se', q: '재산세의 과세기준일은 매년 6월 1일이며, 6월 1일에 부동산 매매 잔금을 지급하여 소유권이 이전된 경우 양도인(매도인)이 납세의무자가 된다.', a: false, exp: '과세기준일(6월 1일) 당일에 양도·양수된 경우에는 그 부동산을 취득한 "양수인(매수인)"이 그 해 재산세 납세의무자가 됩니다.' },
      { id: 'q-se-4', subjectId: 'se', q: '주택에 대한 재산세는 산출세액의 2분의 1은 매년 7월 16일부터 7월 31일까지, 나머지 2분의 1은 9월 16일부터 9월 30일까지 부과·징수한다.', a: true, exp: '주택분 재산세는 세부담 완화를 위해 7월과 9월에 절반씩 나누어 부과합니다(단, 산출세액이 20만 원 이하인 경우 7월에 한꺼번에 부과 가능).' },
      { id: 'q-se-5', subjectId: 'se', q: '지방자치단체의 장은 재산세 납부세액이 1,000만 원을 초과하는 경우 납세의무자의 신청을 받아 관할구역에 있는 부동산에 한하여 물납을 허가할 수 있다.', a: true, exp: '재산세 물납 기준금액은 "1,000만 원 초과"이며, 관할구역 내 부동산으로만 가능합니다(종합부동산세는 물납 불가).' },
      { id: 'q-se-6', subjectId: 'se', q: '종합부동산세의 납부기간은 매년 12월 1일부터 12월 15일까지이며, 납부할 세액이 250만 원을 초과하는 경우 납부기한이 지난 날부터 6개월 이내에 분납할 수 있다.', a: true, exp: '종부세 납기는 12월 1일~15일이며, 250만 원 초과 시 6개월 이내 분납이 가능합니다(재산세 분납은 3개월 이내).' },
      { id: 'q-se-7', subjectId: 'se', q: '종합부동산세법상 주택분 종합부동산세는 원칙적으로 납세의무자가 매년 12월 1일부터 12월 15일까지 관할 세무서장에게 신고·납부하여야 한다.', a: false, exp: '종합부동산세는 원칙적으로 관할 세무서장이 세액을 결정하여 고지하는 "부과징수" 방식이며, 납세자가 신고납부를 선택할 수도 있습니다.' },
      { id: 'q-se-8', subjectId: 'se', q: '이혼 시 민법에 따른 재산분할청구권 행사로 부동산의 소유권이 이전되는 경우에는 양도소득세 과세대상인 양도로 본다.', a: false, exp: '이혼 시 재산분할은 부부 공동재산의 청산이므로 양도로 보지 않습니다(반면, 이혼 위자료로 부동산을 넘기는 대물변제는 양도에 해당).' },
      { id: 'q-se-9', subjectId: 'se', q: '도시개발법이나 그 밖의 법률에 따른 환지처분으로 지목 또는 지번이 변경되거나 체비지로 충당되는 경우에는 양도소득세 과세대상인 양도로 보지 아니한다.', a: true, exp: '환지처분으로 인한 지목·지번 변경 및 체비지 충당은 양도소득세법상 양도로 보지 않습니다.' },
      { id: 'q-se-10', subjectId: 'se', q: '양도소득세 과세대상 부동산을 양도한 거주자는 그 양도일이 속하는 달의 말일부터 2개월 이내에 양도소득과세표준을 납세지 관할 세무서장에게 예정신고하여야 한다.', a: true, exp: '부동산 양도소득세 예정신고 기한은 양도일이 속하는 달의 말일부터 2개월 이내입니다.' },
      { id: 'q-se-11', subjectId: 'se', q: '양도차익을 계산할 때 보유 기간 중 납부한 재산세와 종합부동산세는 양도가액에서 공제되는 기타필요경비에 포함된다.', a: false, exp: '재산세·종합부동산세는 보유 중 비용이므로 양도소득세 필요경비로 공제되지 않습니다(취득세·중개보수·자본적 지출은 공제 O).' },
      { id: 'q-se-12', subjectId: 'se', q: '고지서 1장당 재산세로 징수할 세액이 2,000원 미만인 경우에는 해당 재산세를 징수하지 아니한다(소액징수면제).', a: true, exp: '재산세는 고지서 1장당 세액이 2,000원 미만일 때 소액징수면제가 적용됩니다.' }
    ];

    // 26주(182일 = 6개월 이상) 주차별 커리큘럼 설계표
    const WEEK_BLUEPRINTS = [

    const TOTAL_DAYS = 182; // 26주 * 7일
    const CURRICULUM_WEEKS = [];
    const ALL_DAYS = [];

    (function build26WeekCurriculum() {
      const dayNames = ['월', '화', '수', '목', '금', '토', '일(쪽지시험)'];
      let globalDay = 1;

      WEEK_BLUEPRINTS.forEach((wb) => {
        const weekDays = [];
        for (let d = 0; d < 7; d++) {
          const isWeeklyTest = (d === 6); // 매주 7일차(7, 14, 21... 182일차)는 주간 쪽지시험!
          const subjId = wb.subjs[d % wb.subjs.length];
          const subjObj = SUBJECTS.find(s => s.id === subjId);
          const chTitle = subjObj.chapters[(wb.w + d) % subjObj.chapters.length];

          const dayObj = {
            dayNum: globalDay,
            weekNum: wb.w,
            dayInWeek: d + 1,
            dayName: dayNames[d],
            phase: wb.phase,
            round: wb.round,
            subjId: subjId,
            weekSubjs: wb.subjs,
            isWeeklyTest: isWeeklyTest,
            title: isWeeklyTest
              ? `📝 [${wb.w}주차 종합 쪽지시험] 지난 6일(${globalDay - 6}~${globalDay - 1}일차) 총점검`
              : `[${subjObj.short}] ${chTitle.replace(/^\d+장\.\s*/, '')}`,
            mission: isWeeklyTest
              ? `${wb.w}주차 동안 배운 핵심 개념과 기출 지문을 8문항 쪽지시험으로 점검합니다. 80점(6문제) 이상 합격 도전!`
              : `${subjObj.name} ${wb.round}회독 진도입니다. 쉬운 용어 워밍업 후 요약 노트와 기출 OX를 완주하세요.`
          };

          weekDays.push(dayObj);
          ALL_DAYS.push(dayObj);
          globalDay++;
        }

        CURRICULUM_WEEKS.push({
          w: wb.w,
          phase: wb.phase,
          title: wb.title,
          round: wb.round,
          startDay: weekDays[0].dayNum,
          endDay: weekDays[6].dayNum,
          days: weekDays
        });
      });
    })();

    // Building Stages for Gamification (합격의 집 건축 단계)
    const BUILDING_STAGES = [
      { minMins: 0, maxMins: 59, level: 1, title: 'Lv.1 황금빛 나대지 (지목: 대)', desc: '공법상 대지 조성 완료! 첫 삽을 뜨며 합격의 터전을 마련했습니다.' },

    // =========================================================================
    // 3. KST (KOREA STANDARD TIME, UTC+9) & STORAGE MANAGEMENT
    // =========================================================================
    function getKSTInfo() {
      const kstMs = Date.now() + (9 * 60 * 60 * 1000);
      const kstDate = new Date(kstMs);
      const y = kstDate.getUTCFullYear();
      const m = String(kstDate.getUTCMonth() + 1).padStart(2, '0');
      const d = String(kstDate.getUTCDate()).padStart(2, '0');
      const dateStr = `${y}-${m}-${d}`;
      return { dateStr, month: kstDate.getUTCMonth() + 1, day: kstDate.getUTCDate() };
    }

    function getYesterdayKSTStr() {
      const yesterdayMs = Date.now() + (9 * 60 * 60 * 1000) - (24 * 60 * 60 * 1000);
      const d = new Date(yesterdayMs);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    }

    const STORAGE_KEY = 'realtor2027_couple_26weeks_v4';
    const LEGACY_KEYS = ['realtor2027_couple_app_v3', 'realtor_2027_couple_master_v2'];

    function checkStorageAvailable() {
      try {
        const testKey = '__test_ls__';
        localStorage.setItem(testKey, '1');
        localStorage.removeItem(testKey);
        return true;
      } catch (e) {
        return false;
      }
    }

    const isStorageAvailable = checkStorageAvailable();

    function createDefaultUserData(name, avatar) {
      return {
        name,
        avatar,
        totalSeconds: 0,
        streakDays: 0,
        lastStudyDate: null,
        selectedDay: 1,          // 1일차 ~ 182일차 (26주)
        maxUnlockedDay: 1,
        lastActiveDateForDay: null,
        dailyGoalMins: 30,
        strategyMode: 'first_priority',
        dailyShuffleOffset: 0,
        dailyShuffleDate: null,
        completedDays: {},       // { [dayNum]: true } - 일차별 완주 체크
        weeklyTestResults: {},   // { [weekNum]: { score: number, total: number, passed: boolean, answers: {} } }
        completedChapters: {},
        readNotes: {},
        solvedQuizzes: {},
        wrongQuizzes: {},
        todayDoneNotes: {},
        todayDoneQuizzes: {},
        dayPlans: {},
        assignedNoteDay: {},
        assignedQuizDay: {},
        customNotes: []
      };
    }

    function normalizeUserData(u, fallbackName, fallbackAvatar) {
      const base = createDefaultUserData(fallbackName, fallbackAvatar);
      const merged = {
        ...base,
        ...(u || {}),
        completedDays: (u && u.completedDays && !Array.isArray(u.completedDays)) ? u.completedDays : {},
        weeklyTestResults: (u && u.weeklyTestResults) || {},
        completedChapters: (u && u.completedChapters) || {},
        readNotes: (u && u.readNotes) || {},
        solvedQuizzes: (u && u.solvedQuizzes) || {},
        wrongQuizzes: (u && u.wrongQuizzes) || {},
        todayDoneNotes: (u && u.todayDoneNotes) || {},
        todayDoneQuizzes: (u && u.todayDoneQuizzes) || {},
        dayPlans: (u && u.dayPlans) || {},
        assignedNoteDay: (u && u.assignedNoteDay) || {},
        assignedQuizDay: (u && u.assignedQuizDay) || {},
        customNotes: (u && Array.isArray(u.customNotes)) ? u.customNotes : []
      };

      const kstToday = getKSTInfo().dateStr;
      if (!merged.lastActiveDateForDay) {
        if (merged.lastStudyDate && merged.lastStudyDate !== kstToday) {
          merged.selectedDay = Math.min(TOTAL_DAYS, Math.max(2, (merged.streakDays || 1) + 1));
          merged.maxUnlockedDay = merged.selectedDay;
        }
        merged.lastActiveDateForDay = kstToday;
      } else if (merged.lastActiveDateForDay !== kstToday) {
        merged.selectedDay = Math.min(TOTAL_DAYS, (merged.selectedDay || 1) + 1);
        merged.maxUnlockedDay = Math.max(merged.maxUnlockedDay || 1, merged.selectedDay);
        merged.lastActiveDateForDay = kstToday;
      }
      return merged;
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const lk of LEGACY_KEYS) {
            const legacyRaw = localStorage.getItem(lk);
            if (legacyRaw) {
              raw = legacyRaw;
              break;
            }
          }
        }
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.users) {
            return {
              activeProfile: parsed.activeProfile === 'husband' ? 'husband' : 'wife',
              users: {
                wife: normalizeUserData(parsed.users.wife, '아내 (합격생)', '👩'),
                husband: normalizeUserData(parsed.users.husband, '남편 (러닝메이트)', '👨')
              }
            };
          }
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      return {
        activeProfile: 'wife',
        users: {
          wife: createDefaultUserData('아내 (합격생)', '👩'),
          husband: createDefaultUserData('남편 (러닝메이트)', '👨')
        }
      };
    }

    let appState = loadState();
    let currentKSTDate = getKSTInfo().dateStr;

    let uiState = {
      activeTab: 'today',
      curriculumSubTab: 'weeks', // 'weeks'(26주코스) | 'notes'(요약노트) | 'quiz'(OX뱅크) | 'progress'(6과목진도) | 'terms'(기초용어)
      selectedSubjectFilter: 'all',
      roadmapPhaseFilter: 'all',
      quizFilter: 'all',
      openNoteId: null,
      quizAnswers: {},
      weeklyQuizDraft: {},       // { [weekNum]: { [quizId]: boolean } } - 7일차 쪽지시험 임시 답안
      timerRunning: false,
      sessionSeconds: 0,
      showAddNoteModal: false,
      showEditNameModal: false,
      showBackupModal: false,
      showDayJumpModal: false,
      backupText: '',
      toastMessage: null
    };

    let timerInterval = null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    function getActiveUser() {
      return appState.users[appState.activeProfile];
    }

    function getAllNotes() {
      const user = getActiveUser();
      return [...STUDY_NOTES, ...(user.customNotes || [])];
    }

    function showToast(msg) {
      uiState.toastMessage = msg;
      render();
      setTimeout(() => {
        if (uiState.toastMessage === msg) {
          uiState.toastMessage = null;
          render();
        }
      }, 2600);
    }

    function checkKSTRollover(notify = false) {
      const kst = getKSTInfo();
      if (kst.dateStr !== currentKSTDate) {
        currentKSTDate = kst.dateStr;
        uiState.sessionSeconds = 0;
        uiState.quizAnswers = {};
        uiState.openNoteId = null;

        ['wife', 'husband'].forEach(key => {
          const u = appState.users[key];
          if (u.dailyShuffleDate !== kst.dateStr) {
            u.dailyShuffleOffset = 0;
            u.dailyShuffleDate = kst.dateStr;
          }
          if (u.lastActiveDateForDay !== kst.dateStr) {
            u.selectedDay = Math.min(TOTAL_DAYS, (u.selectedDay || 1) + 1);
            u.maxUnlockedDay = Math.max(u.maxUnlockedDay || 1, u.selectedDay);
            u.lastActiveDateForDay = kst.dateStr;
          }
        });
        saveState();
        if (notify) {
          showToast(`🌅 ${kst.month}월 ${kst.day}일 새 학습 차수가 준비되었습니다!`);
        } else {
          render();
        }
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkKSTRollover(true);
    });
    window.addEventListener('pageshow', () => checkKSTRollover(true));
    window.addEventListener('focus', () => checkKSTRollover(false));
    setInterval(() => checkKSTRollover(true), 60 * 1000);

    // =========================================================================
    // 4. ACTIONS & LOGIC (1~182일차 이동 + 7일차 주간 쪽지시험 포함)
    // =========================================================================
    function switchProfile(profileKey) {
      if (appState.activeProfile === profileKey) return;
      if (uiState.timerRunning) stopTimer();
      appState.activeProfile = profileKey;
      uiState.openNoteId = null;
      uiState.quizAnswers = {};
      saveState();
      showToast(`${getActiveUser().avatar} ${getActiveUser().name} 계정으로 전환되었습니다`);
    }

    function setDailyGoal(mins) {
      const user = getActiveUser();
      user.dailyGoalMins = mins;
      saveState();
      render();
    }

    function setStrategyMode(mode) {
      const user = getActiveUser();
      user.strategyMode = mode;
      saveState();
      showToast(mode === 'first_priority' ? '🎯 1차 우선 합격 전략(75:25) 적용!' : '📚 1·2차 동차 합격 전략(50:50) 적용!');
    }

    function selectDay(dayNum, switchToToday = false) {
      const target = Math.max(1, Math.min(TOTAL_DAYS, parseInt(dayNum, 10) || 1));
      const user = getActiveUser();
      user.selectedDay = target;
      user.maxUnlockedDay = Math.max(user.maxUnlockedDay || 1, target);
      user.dailyShuffleOffset = 0;
      uiState.openNoteId = null;
      uiState.quizAnswers = {};
      uiState.showDayJumpModal = false;
      if (switchToToday) {
        uiState.activeTab = 'today';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      saveState();
      const dayInfo = ALL_DAYS[target - 1];
      showToast(`📅 ${dayInfo.weekNum}주차 ${target}일차${dayInfo.isWeeklyTest ? ' (주간 쪽지시험!)' : ''}로 이동!`);
    }

    function prevDay() {
      const user = getActiveUser();
      const cur = user.selectedDay || 1;
      if (cur <= 1) {
        showToast('이미 첫 번째(1일차) 코스입니다!');
        return;
      }
      selectDay(cur - 1, false);
    }

    function nextDay() {
      const user = getActiveUser();
      const cur = user.selectedDay || 1;
      if (cur >= TOTAL_DAYS) {
        showToast('26주(182일차) 전체 커리큘럼 마지막 차수입니다!');
        return;
      }
      selectDay(cur + 1, false);
    }

    function toggleDayComplete(dayNum) {
      const user = getActiveUser();
      const isCurrentlyDone = !!user.completedDays[dayNum];
      if (!isCurrentlyDone) {
        user.completedDays[dayNum] = true;
        user.totalSeconds += 300; // 5분 보너스 적립
        updateStreak(user);
        saveState();
        if (dayNum < TOTAL_DAYS) {
          user.selectedDay = dayNum + 1;
          user.maxUnlockedDay = Math.max(user.maxUnlockedDay || 1, dayNum + 1);
          saveState();
          showToast(`🎉 ${dayNum}일차 완주 체크! 자동으로 ${dayNum + 1}일차로 이동합니다.`);
        } else {
          showToast('🏆 축하합니다! 26주(182일) 대장정을 모두 완주하셨습니다!');
        }
      } else {
        delete user.completedDays[dayNum];
        saveState();
        showToast(`${dayNum}일차 완료 표시가 해제되었습니다.`);
      }
    }

    function resetAllProgress() {
      const user = getActiveUser();
      if (!confirm(`${user.name}님의 모든 학습 완료·쪽지시험·문제 풀이·시간 기록을 처음(1일차 0%) 상태로 초기화할까요?`)) return;
      const fresh = createDefaultUserData(user.name, user.avatar);
      fresh.dailyGoalMins = user.dailyGoalMins;
      fresh.strategyMode = user.strategyMode;
      fresh.customNotes = user.customNotes || [];
      appState.users[appState.activeProfile] = fresh;
      uiState.openNoteId = null;
      uiState.quizAnswers = {};
      uiState.weeklyQuizDraft = {};
      uiState.sessionSeconds = 0;
      if (uiState.timerRunning) stopTimer();
      saveState();
      showToast('🧹 아무것도 안 한 처음(1일차) 상태로 초기화되었습니다!');
    }

    function shuffleTodaySet() {
      const user = getActiveUser();
      const kst = getKSTInfo();
      if (user.dailyShuffleDate !== kst.dateStr) {
        user.dailyShuffleDate = kst.dateStr;
        user.dailyShuffleOffset = 1;
      } else {
        user.dailyShuffleOffset = (user.dailyShuffleOffset || 0) + 1;
      }
      if (user.dayPlans) {
        const curDay = user.selectedDay || 1;
        delete user.dayPlans[`${curDay}_30_${user.strategyMode}`];
        delete user.dayPlans[`${curDay}_60_${user.strategyMode}`];
      }
      uiState.openNoteId = null;
      uiState.quizAnswers = {};
      saveState();
      showToast('🔄 새로운 요약 노트와 OX 문제 세트로 교체했습니다!');
    }

    function toggleTimer() {
      if (uiState.timerRunning) stopTimer();
      else startTimer();
    }

    function startTimer() {
      if (uiState.timerRunning) return;
      uiState.timerRunning = true;
      timerInterval = setInterval(() => {
        uiState.sessionSeconds += 1;
        const user = getActiveUser();
        user.totalSeconds += 1;
        updateStreak(user);
        if (uiState.sessionSeconds % 5 === 0) saveState();
        render();
      }, 1000);
      render();
    }

    function stopTimer() {
      uiState.timerRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      saveState();
      render();
    }

    function addQuickMinutes(mins) {
      const user = getActiveUser();
      user.totalSeconds += mins * 60;
      uiState.sessionSeconds += mins * 60;
      updateStreak(user);
      saveState();
      showToast(`⏱️ +${mins}분 학습 시간이 기록되었습니다!`);
    }

    function updateStreak(user) {
      const today = getKSTInfo().dateStr;
      if (user.lastStudyDate === today) return;
      const yesterday = getYesterdayKSTStr();
      if (user.lastStudyDate === yesterday) {
        user.streakDays = (user.streakDays || 0) + 1;
      } else {
        user.streakDays = 1;
      }
      user.lastStudyDate = today;
    }

    function getDisplayStreak(user) {
      const today = getKSTInfo().dateStr;
      const yesterday = getYesterdayKSTStr();
      if (!user.lastStudyDate) return 0;
      if (user.lastStudyDate === today || user.lastStudyDate === yesterday) {
        return user.streakDays || 1;
      }
      return 0;
    }

    function toggleChapter(subjectId, idx) {
      const user = getActiveUser();
      const key = `${subjectId}-${idx}`;
      user.completedChapters[key] = !user.completedChapters[key];
      updateStreak(user);
      saveState();
      render();
    }

    function toggleReadNote(noteId) {
      const user = getActiveUser();
      const today = getKSTInfo().dateStr;
      user.readNotes[noteId] = !user.readNotes[noteId];
      if (!user.todayDoneNotes[today]) user.todayDoneNotes[today] = [];
      if (user.readNotes[noteId]) {
        if (!user.todayDoneNotes[today].includes(noteId)) {
          user.todayDoneNotes[today].push(noteId);
        }
        if (!user.assignedNoteDay) user.assignedNoteDay = {};
        user.assignedNoteDay[noteId] = user.selectedDay || 1;
        // 이미 다른 미래 차수에 캐시된 플랜이 있다면 완료된 노트는 즉시 제거하여 다음 차수에 다시 뜨지 않게 처리
        if (user.dayPlans) {
          const curDayPrefix = `${user.selectedDay || 1}_`;
          Object.keys(user.dayPlans).forEach(k => {
            if (!k.startsWith(curDayPrefix) && user.dayPlans[k] && Array.isArray(user.dayPlans[k].noteIds)) {
              user.dayPlans[k].noteIds = user.dayPlans[k].noteIds.filter(id => id !== noteId);
            }
          });
        }
        user.totalSeconds += 180;
        updateStreak(user);
        showToast('✅ 요약 노트 완료! 다음 차수부터는 자동으로 새 노트가 배정됩니다.');
      }
      saveState();
      render();
    }

    function answerQuiz(quizId, userChoice) {
      const quiz = OX_QUIZZES.find(q => q.id === quizId);
      if (!quiz) return;
      const isCorrect = quiz.a === userChoice;
      uiState.quizAnswers[quizId] = { userChoice, isCorrect };

      const user = getActiveUser();
      const today = getKSTInfo().dateStr;
      user.solvedQuizzes[quizId] = { correct: isCorrect, date: today };
      if (!user.todayDoneQuizzes[today]) user.todayDoneQuizzes[today] = [];
      if (!user.todayDoneQuizzes[today].includes(quizId)) {
        user.todayDoneQuizzes[today].push(quizId);
      }

      if (isCorrect) {
        delete user.wrongQuizzes[quizId];
        if (!user.assignedQuizDay) user.assignedQuizDay = {};
        user.assignedQuizDay[quizId] = user.selectedDay || 1;
        // 이미 다른 미래 차수에 캐시된 플랜이 있다면 맞힌 문제는 즉시 제거
        if (user.dayPlans) {
          const curDayPrefix = `${user.selectedDay || 1}_`;
          Object.keys(user.dayPlans).forEach(k => {
            if (!k.startsWith(curDayPrefix) && user.dayPlans[k] && Array.isArray(user.dayPlans[k].quizIds)) {
              user.dayPlans[k].quizIds = user.dayPlans[k].quizIds.filter(id => id !== quizId);
            }
          });
        }
        user.totalSeconds += 90;
      } else {
        user.wrongQuizzes[quizId] = true;
        user.totalSeconds += 60;
      }
      updateStreak(user);
      saveState();
      render();
    }

    function resetQuizChoice(quizId) {
      delete uiState.quizAnswers[quizId];
      render();
    }

    function getWeeklyTestQuestions(weekNum) {
      const wb = WEEK_BLUEPRINTS[weekNum - 1] || WEEK_BLUEPRINTS[0];
      const weekSubjSet = new Set(wb.subjs || ['hak', 'min']);
      const pool = OX_QUIZZES.filter(q => weekSubjSet.has(q.subjectId));
      const targetPool = pool.length >= 8 ? pool : OX_QUIZZES;
      const picked = [];
      const start = ((weekNum - 1) * 3) % targetPool.length;
      for (let i = 0; i < Math.min(8, targetPool.length); i++) {
        picked.push(targetPool[(start + i) % targetPool.length]);
      }
      return picked;
    }

    function selectWeeklyDraftAnswer(weekNum, quizId, choice) {
      if (!uiState.weeklyQuizDraft[weekNum]) {
        uiState.weeklyQuizDraft[weekNum] = {};
      }
      uiState.weeklyQuizDraft[weekNum][quizId] = choice;
      render();
    }

    function submitWeeklyTest(weekNum, dayNum) {
      const questions = getWeeklyTestQuestions(weekNum);
      const draft = uiState.weeklyQuizDraft[weekNum] || {};
      const unanswered = questions.filter(q => draft[q.id] === undefined).length;
      if (unanswered > 0) {
        showToast(`⚠️ 아직 선택하지 않은 문항이 ${unanswered}개 있습니다!`);
        return;
      }

      const user = getActiveUser();
      const today = getKSTInfo().dateStr;
      let correctCount = 0;

      questions.forEach(q => {
        const isCorrect = draft[q.id] === q.a;
        user.solvedQuizzes[q.id] = { correct: isCorrect, date: today };
        if (isCorrect) {
          correctCount++;
          delete user.wrongQuizzes[q.id];
        } else {
          user.wrongQuizzes[q.id] = true;
        }
      });

      const total = questions.length;
      const scorePct = Math.round((correctCount / total) * 100);
      const passed = correctCount >= 6;

      user.weeklyTestResults[weekNum] = {
        scorePct,
        correctCount,
        total,
        passed,
        answers: { ...draft }
      };

      user.completedDays[dayNum] = true;
      user.totalSeconds += 600; // 쪽지시험 완료 10분 적립
      updateStreak(user);
      saveState();
      showToast(passed ? `🎉 ${weekNum}주차 쪽지시험 ${scorePct}점 합격!` : `📝 채점 완료 (${scorePct}점) - 해설을 확인해 보세요!`);
    }

    function retakeWeeklyTest(weekNum) {
      const user = getActiveUser();
      delete user.weeklyTestResults[weekNum];
      uiState.weeklyQuizDraft[weekNum] = {};
      saveState();
      showToast(`🔄 ${weekNum}주차 쪽지시험을 다시 응시합니다.`);
    }

      const analogy = String(fd.get('analogy') || '').trim() || '나만의 핵심 요약 정리';

      if (!title || !point1) return;

      user.customNotes.unshift({

        roundTag: 1,

    // =========================================================================
    // 6. DAILY RECOMMENDATION ENGINE (STRICT WEEK-SUBJECT + UNSEEN-FIRST 배정)
    // =========================================================================
    function getDailyPlan() {
      const user = getActiveUser();
      const dayNum = user.selectedDay || 1;
      const dayMeta = ALL_DAYS[dayNum - 1] || ALL_DAYS[0];
      const dayZeroIdx = dayNum - 1;
      const is60 = user.dailyGoalMins === 60;
      const noteTargetCount = is60 ? 4 : 2;
      const quizTargetCount = is60 ? 8 : 4;

      const allNotes = getAllNotes();
      // 엄격하게 해당 주차 진도 과목(예: 1주차면 ['hak', 'min']만!) 안에서만 출제하여 2차 세법 등이 튀어나오지 않도록 차단!
      const weekSubjSet = new Set(dayMeta.weekSubjs || ['hak', 'min']);
      const targetRound = dayMeta.round || 1;

      const weekNotesAll = allNotes.filter(n => weekSubjSet.has(n.subjectId));
      const weekNotesRoundFirst = weekNotesAll.filter(n => !n.roundTag || n.roundTag === targetRound);

      const weekQuizzesAll = OX_QUIZZES.filter(q => weekSubjSet.has(q.subjectId));

      const shuffleOffset = user.dailyShuffleOffset || 0;
      if (!user.assignedNoteDay) user.assignedNoteDay = {};
      if (!user.assignedQuizDay) user.assignedQuizDay = {};

      function pickStrictWeekNotes(count, alreadyIds) {
        const picked = [];
        const pickedIds = new Set(alreadyIds || []);

        // 1순위: 해당 주차 과목 + 현재 회독 + 아직 완료(readNotes)하지 않은 노트
        const tier1 = weekNotesRoundFirst.filter(n => !user.readNotes[n.id]);
        // 2순위: 해당 주차 과목 전체 회독 중 아직 완료하지 않은 노트
        const tier2 = weekNotesAll.filter(n => !user.readNotes[n.id]);
        // 3순위: 해당 주차 과목 전체 노트 (모두 완료했을 때만 순환)
        const tier3 = weekNotesAll;

        for (const bucket of [tier1, tier2, tier3]) {
          if (picked.length >= count || bucket.length === 0) continue;
          const start = (dayZeroIdx * count + shuffleOffset * count) % bucket.length;
          for (let i = 0; i < bucket.length && picked.length < count; i++) {
            const item = bucket[(start + i) % bucket.length];
            if (!pickedIds.has(item.id)) {
              pickedIds.add(item.id);
              picked.push(item);
            }
          }
        }
        return picked;
      }

      function pickStrictWeekQuizzes(count, alreadyIds) {
        const picked = [];
        const pickedIds = new Set(alreadyIds || []);
        const isDone = (q) => !!(user.solvedQuizzes[q.id] && user.solvedQuizzes[q.id].correct);

        // 해당 주차 과목의 오답노트 문제가 있으면 1개 우선 복습
        const wrongIds = Object.keys(user.wrongQuizzes || {});
        const wrongPool = weekQuizzesAll.filter(q => wrongIds.includes(q.id) && !pickedIds.has(q.id));
        if (wrongPool.length > 0 && dayNum > 1 && count > 0) {
          const wq = wrongPool[(dayZeroIdx + shuffleOffset) % wrongPool.length];
          picked.push(wq);
          pickedIds.add(wq.id);
        }

        // 1순위: 해당 주차 과목 중 아직 정답 처리되지 않은 문제
        const tier1 = weekQuizzesAll.filter(q => !isDone(q));
        // 2순위: 해당 주차 과목 전체 문제
        const tier2 = weekQuizzesAll;

        for (const bucket of [tier1, tier2]) {
          if (picked.length >= count || bucket.length === 0) continue;
          const start = (dayZeroIdx * count + shuffleOffset * count) % bucket.length;
          for (let i = 0; i < bucket.length && picked.length < count; i++) {
            const item = bucket[(start + i) % bucket.length];
            if (!pickedIds.has(item.id)) {
              pickedIds.add(item.id);
              picked.push(item);
            }
          }
        }
        return picked;
      }

      if (!user.dayPlans) user.dayPlans = {};
      const planKey = `${dayNum}_${user.dailyGoalMins}_${user.strategyMode}`;
      const cached = user.dayPlans[planKey];

      let todayNotes = [];
      let todayQuizzes = [];

      if (cached && Array.isArray(cached.noteIds) && Array.isArray(cached.quizIds)) {
        // 현재 일차에 이미 완료한 항목은 화면에 유지하되, 다른 일차에서 완료된 항목은 자동 제외!
        todayNotes = cached.noteIds
          .filter(id => !(user.readNotes[id] && user.assignedNoteDay[id] !== dayNum))
          .map(id => weekNotesAll.find(n => n.id === id))
          .filter(Boolean);

        todayQuizzes = cached.quizIds
          .filter(id => !((user.solvedQuizzes[id] && user.solvedQuizzes[id].correct) && user.assignedQuizDay[id] !== dayNum))
          .map(id => weekQuizzesAll.find(q => q.id === id))
          .filter(Boolean);
      }

      let needsSave = !cached;

      if (todayNotes.length < noteTargetCount) {
        const moreNotes = pickStrictWeekNotes(noteTargetCount - todayNotes.length, todayNotes.map(n => n.id));
        todayNotes = [...todayNotes, ...moreNotes];
        needsSave = true;
      }

      if (todayQuizzes.length < quizTargetCount) {
        const moreQuizzes = pickStrictWeekQuizzes(quizTargetCount - todayQuizzes.length, todayQuizzes.map(q => q.id));
        todayQuizzes = [...todayQuizzes, ...moreQuizzes];
        needsSave = true;
      }

      if (needsSave) {
        user.dayPlans[planKey] = {
          noteIds: todayNotes.map(n => n.id),
          quizIds: todayQuizzes.map(q => q.id)
        };
        saveState();
      }

      const matchingTerms = BEGINNER_TERMS.filter(t => weekSubjSet.has(t.subj));
      const termPool = matchingTerms.length > 0 ? matchingTerms : BEGINNER_TERMS;
      const termOfDay = termPool[(dayZeroIdx + shuffleOffset) % termPool.length];

      return {
        dayMeta,
        noteTargetCount,
        quizTargetCount,
        todayNotes,
        todayQuizzes,
        termOfDay
      };
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatHoursMins(sec) {
      const totalMins = Math.floor(sec / 60);
      const h = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      if (h === 0) return `${m}분`;
      return `${h}시간 ${m}분`;
    }

    function getSubjectMeta(id) {
      return SUBJECTS.find(s => s.id === id) || SUBJECTS[0];
    }

    function getBuildingStage(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      return BUILDING_STAGES.find(s => mins >= s.minMins && mins <= s.maxMins) || BUILDING_STAGES[0];
    }

    function renderWeeklyQuizSection(dayMeta) {

      const answeredCount = questions.filter(q => draft[q.id] !== undefined).length;

      return `

            </div>

                <span class="text-xs font-bold opacity-90">${weekNum}주차 쪽지시험 성적표</span>
                <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-white/20">

                  : '아쉽게 75점 기준에 조금 못 미쳤어요! 아래 빨간색 틀린 지문의 해설을 꼭 읽고 재응시해 보세요.'}

              <span class="text-[11px] font-semibold text-amber-800">합격기준 75점(6개)</span>

                      <span class="text-[11px] font-extrabold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">

                        chosen === true
                          ? (isGraded
                              ? (q.a === true ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-rose-600 border-rose-600 text-white')
                              : 'bg-indigo-600 border-indigo-600 text-white shadow-xs')
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300'
                      }">
                      ⭕ 맞다 (O)

                    <button onclick="selectWeeklyDraftAnswer(${weekNum}, '${q.id}', false)" ${isGraded ? 'disabled' : ''}

                        chosen === false
                          ? (isGraded
                              ? (q.a === false ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-rose-600 border-rose-600 text-white')
                              : 'bg-indigo-600 border-indigo-600 text-white shadow-xs')
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300'

                      <strong class="text-slate-900">해설:</strong> ${q.exp}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          ${!savedResult ? `
            <button onclick="submitWeeklyTest(${weekNum}, ${dayMeta.dayNum})"
              class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-amber-300 font-black text-sm shadow-md active:scale-98 transition-all">

            </button>
          ` : ''}
        </div>
      `;
    }

    function renderQuizCard(q, num) {
      const sub = getSubjectMeta(q.subjectId);
      const user = getActiveUser();
      const attempt = uiState.quizAnswers[q.id];
      const isWrongSaved = !!user.wrongQuizzes[q.id];
      const prevSolved = user.solvedQuizzes[q.id];

      return `
        <div class="p-3.5 rounded-xl border ${attempt ? (attempt.isCorrect ? 'border-emerald-300 bg-emerald-50/40' : 'border-rose-300 bg-rose-50/40') : 'border-slate-200 bg-slate-50/40'} space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-extrabold text-slate-400">Q${num}.</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${sub.badge}">${sub.part}차 · ${sub.short}</span>
              ${isWrongSaved ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-700">오답복습</span>' : ''}
              ${(!isWrongSaved && prevSolved && prevSolved.correct) ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">✓ 완료</span>' : ''}
            </div>
            ${attempt ? `<button onclick="resetQuizChoice('${q.id}')" class="text-[10px] text-slate-400 underline">다시풀기</button>` : ''}
          </div>

          <p class="text-xs font-bold text-slate-800 leading-relaxed">${q.q}</p>

          ${!attempt ? `
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="answerQuiz('${q.id}', true)"
                class="py-2.5 rounded-xl bg-white border-2 border-blue-200 hover:border-blue-500 text-blue-700 font-black text-sm shadow-2xs active:scale-98 transition-all">
                ⭕ 맞다 (O)
              </button>
              <button onclick="answerQuiz('${q.id}', false)"
                class="py-2.5 rounded-xl bg-white border-2 border-rose-200 hover:border-rose-500 text-rose-700 font-black text-sm shadow-2xs active:scale-98 transition-all">
                ❌ 틀리다 (X)
              </button>
            </div>
          ` : `
            <div class="p-2.5 rounded-lg bg-white border ${attempt.isCorrect ? 'border-emerald-200' : 'border-rose-200'} space-y-1">
              <div class="flex items-center justify-between text-xs font-extrabold">
                <span class="${attempt.isCorrect ? 'text-emerald-700' : 'text-rose-600'}">
                  ${attempt.isCorrect ? '🎉 정답입니다!' : '😅 아쉽네요! 오답노트에 자동 저장됨'}
                </span>
                <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-800">정답: ${q.a ? 'O' : 'X'}</span>
              </div>
              <p class="text-[11px] text-slate-600 leading-relaxed pt-1">${q.exp}</p>
            </div>
          `}
        </div>
      `;
    }

    function getSubjectCoverage(user, sub) {
      const chapTotal = sub.chapters.length;
      const chapDone = sub.chapters.filter((_, idx) => !!user.completedChapters[`${sub.id}-${idx}`]).length;

      const notes = getAllNotes().filter(n => n.subjectId === sub.id);
      const notesTotal = notes.length;
      const notesDone = notes.filter(n => !!user.readNotes[n.id]).length;

      const quizzes = OX_QUIZZES.filter(q => q.subjectId === sub.id);
      const quizTotal = quizzes.length;
      const quizDone = quizzes.filter(q => !!(user.solvedQuizzes[q.id] && user.solvedQuizzes[q.id].correct)).length;

      const chapPct = chapTotal > 0 ? (chapDone / chapTotal) : 0;
      const notePct = notesTotal > 0 ? (notesDone / notesTotal) : 0;
      const quizPct = quizTotal > 0 ? (quizDone / quizTotal) : 0;
      const totalPct = Math.round((chapPct * 0.4 + notePct * 0.3 + quizPct * 0.3) * 100);

      return {
        chapDone, chapTotal,
        notesDone, notesTotal,
        quizDone, quizTotal,
        totalPct
      };
    }

    function renderCoverageDashboard(user) {
      const subStats = SUBJECTS.map(s => ({ ...s, stat: getSubjectCoverage(user, s) }));
      const part1Subs = subStats.filter(s => s.part === 1);
      const part2Subs = subStats.filter(s => s.part === 2);

      const part1Pct = Math.round(part1Subs.reduce((a, b) => a + b.stat.totalPct, 0) / part1Subs.length);
      const part2Pct = Math.round(part2Subs.reduce((a, b) => a + b.stat.totalPct, 0) / part2Subs.length);
      const overallPct = Math.round(subStats.reduce((a, b) => a + b.stat.totalPct, 0) / subStats.length);
      const synergyPct = Math.round(Math.min(part1Pct, part2Pct));

      function getHexPoints(radiusRatio) {

      const labelOffsets = [

      const rVenn = 58;

      return `

            </div>
            <svg viewBox="0 0 320 148" class="w-full h-36">
              <defs>
                <clipPath id="vennOverlapClip">
                  <circle cx="122" cy="74" r="${rVenn}" />

              </defs>

              <circle cx="122" cy="74" r="${rVenn}" fill="#3B82F6" fill-opacity="0.12" stroke="#CBD5E1" stroke-width="2" />
              <circle cx="122" cy="74" r="${rVenn}" fill="none" stroke="#2563EB" stroke-width="4.5"
                stroke-dasharray="${p1Dash} ${circVenn}" stroke-linecap="round" transform="rotate(-90 122 74)" />

                const vy = cy + maxR * ratio * Math.sin(angles[i]);
                const lx = cx + maxR * Math.cos(angles[i]) + labelOffsets[i].dx;

                return `

              </div>

              <div class="space-y-2.5">
                ${CURRICULUM_WEEKS.map(w => `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/70">
                    <div class="flex items-center justify-between text-[11px] font-extrabold text-slate-700 mb-1.5">
                      <span>${w.w}주차 · ${w.title}</span>
                      <span class="text-indigo-600">Day ${w.startDay}~${w.endDay}</span>
                    </div>
                    <div class="grid grid-cols-7 gap-1">
                      ${w.days.map(d => {
                        const isDone = !!user.completedDays[d.dayNum];
                        const isSel = d.dayNum === curDay;
                        return `
                          <button type="button" onclick="selectDay(${d.dayNum}, true)"
                            class="py-1.5 rounded-lg text-[11px] font-extrabold transition-all ${
                              isSel
                                ? 'bg-indigo-600 text-white ring-2 ring-indigo-300'
                                : isDone
                                  ? 'bg-emerald-500 text-white'
                                  : d.isWeeklyTest
                                    ? 'bg-amber-100 text-amber-900 border border-amber-300'
                                    : 'bg-white border border-slate-200 text-slate-700'
                            }">
                            ${d.dayNum}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      if (uiState.showAddNoteModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
            <form onsubmit="handleAddCustomNote(event)" class="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-900">📝 나만의 요약 노트 추가</h3>
                <button type="button" onclick="closeModals()" class="text-slate-400 text-sm font-bold">✕</button>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">과목 선택</label>
                <select name="subjectId" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs font-bold bg-slate-50">
                  ${SUBJECTS.map(s => `<option value="${s.id}">${s.part}차 · ${s.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">핵심 주제 제목 *</label>
                <input name="title" required placeholder="예: 임대차 계약갱신요구권 거절 사유" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">쉬운 비유 / 한 줄 요약</label>
                <input name="analogy" placeholder="예: 실거주 목적이면 집주인이 갱신 거절 가능!" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">핵심 내용 1 *</label>
                <textarea name="point1" required rows="2" placeholder="중요 조문이나 판례 내용을 적어주세요" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs"></textarea>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">핵심 내용 2 (선택)</label>
                <textarea name="point2" rows="2" placeholder="예외 조항이나 비교 포인트를 적어주세요" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs"></textarea>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">암기 팁</label>
                <input name="tip" placeholder="예: 갱신요구권은 1회에 한해 2년 보장!" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs" />
              </div>
              <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-xs">저장하기</button>
            </form>
          </div>
        `;
      }

      if (uiState.showEditNameModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
            <form onsubmit="handleUpdateNames(event)" class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-900">👥 부부 프로필 이름 설정</h3>
                <button type="button" onclick="closeModals()" class="text-slate-400 text-sm font-bold">✕</button>
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">👩 아내 프로필 이름</label>
                <input name="wifeName" value="${appState.users.wife.name}" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs font-bold" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">👨 남편 프로필 이름</label>
                <input name="husbandName" value="${appState.users.husband.name}" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs font-bold" />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-extrabold text-xs">변경 완료</button>
            </form>
          </div>
        `;
      }

      if (uiState.showBackupModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 shadow-2xl">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-900">💾 학습 데이터 백업 & 복원</h3>
                <button type="button" onclick="closeModals()" class="text-slate-400 text-sm font-bold">✕</button>
              </div>
              <p class="text-[11px] text-slate-600 leading-relaxed">
                아래 백업 코드를 복사해 카카오톡 <b>'나에게 보내기'</b>에 저장해 두면, 기기를 바꾸거나 브라우저 데이터가 초기화되어도 언제든 그대로 복원할 수 있습니다.
              </p>
              <textarea id="backupTextarea" rows="5" class="w-full p-2.5 rounded-xl border border-slate-300 bg-slate-50 text-[11px] font-mono text-slate-700">${uiState.backupText}</textarea>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="copyBackupCode()"
                  class="py-2.5 rounded-xl bg-indigo-600 text-white font-extrabold text-xs hover:bg-indigo-700">
                  📋 현재 기록 복사하기
                </button>
                <button type="button" onclick="restoreFromBackupCode()"
                  class="py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-xs hover:bg-emerald-700">
                  📥 붙여넣은 코드 복원
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    function renderBottomNav() {
      const tabs = [
        { id: 'today', icon: '⏱️', label: '오늘학습' },
        { id: 'curriculum', icon: '📚', label: '26주코스·OX' },
        { id: 'house', icon: '🏠', label: '합격의집' }
      ];

      return `
        <nav class="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 safe-nav">
          <div class="grid grid-cols-3">
            ${tabs.map(t => {
              const active = uiState.activeTab === t.id;
              return `
                <button onclick="switchTab('${t.id}')"
                  class="py-2.5 flex flex-col items-center justify-center gap-0.5 transition-all ${active ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}">
                  <span class="text-lg leading-none">${t.icon}</span>
                  <span class="text-[11px] font-extrabold">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </nav>
      `;
    }

    // =========================================================================
    // 9. GLOBAL WINDOW HELPERS & MAIN RENDER
    // =========================================================================
    window.switchProfile = switchProfile;
    window.setDailyGoal = setDailyGoal;
    window.setStrategyMode = setStrategyMode;
    window.userStrategyToggle = () => getActiveUser().strategyMode === 'first_priority' ? 'all_in_one' : 'first_priority';
    window.selectDay = selectDay;
    window.prevDay = prevDay;
    window.nextDay = nextDay;
    window.toggleDayComplete = toggleDayComplete;
    window.resetAllProgress = resetAllProgress;
    window.shuffleTodaySet = shuffleTodaySet;
    window.toggleTimer = toggleTimer;
    window.addQuickMinutes = addQuickMinutes;
    window.toggleChapter = toggleChapter;
    window.toggleReadNote = toggleReadNote;
    window.answerQuiz = answerQuiz;
    window.resetQuizChoice = resetQuizChoice;
    window.selectWeeklyDraftAnswer = selectWeeklyDraftAnswer;
    window.submitWeeklyTest = submitWeeklyTest;
    window.retakeWeeklyTest = retakeWeeklyTest;
    window.handleAddCustomNote = handleAddCustomNote;
    window.handleUpdateNames = handleUpdateNames;
    window.openBackupModal = openBackupModal;
    window.copyBackupCode = copyBackupCode;
    window.restoreFromBackupCode = restoreFromBackupCode;

    window.switchTab = (tabId) => {
      uiState.activeTab = tabId;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    window.setCurriculumSubTab = (sub) => {
      uiState.curriculumSubTab = sub;
      render();
    };

    window.setRoadmapPhaseFilter = (phaseId) => {
      uiState.roadmapPhaseFilter = phaseId;
      render();
    };

    window.setSubjectFilter = (subId) => {
      uiState.selectedSubjectFilter = subId;
      render();
    };

    window.setQuizFilter = (f) => {
      uiState.quizFilter = f;
      render();
    };

    window.toggleOpenNote = (noteId) => {
      uiState.openNoteId = uiState.openNoteId === noteId ? null : noteId;
      render();
    };

    window.goToTerms = () => {
      uiState.activeTab = 'curriculum';
      uiState.curriculumSubTab = 'terms';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };

    window.openDayJumpModal = () => {
      uiState.showDayJumpModal = true;
      render();
    };

    window.openAddNoteModal = () => {
      uiState.showAddNoteModal = true;
      render();
    };

    window.openEditNameModal = () => {
      uiState.showEditNameModal = true;
      render();
    };

    window.closeModals = () => {
      uiState.showAddNoteModal = false;
      uiState.showEditNameModal = false;
      uiState.showBackupModal = false;
      uiState.showDayJumpModal = false;
      render();
    };

    function render() {
      const root = document.getElementById('app');
      let mainContent = '';
      if (uiState.activeTab === 'today') mainContent = renderTodayTab();
      else if (uiState.activeTab === 'curriculum') mainContent = renderCurriculumTab();
      else if (uiState.activeTab === 'house') mainContent = renderHouseTab();

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 safe-pb">
          ${mainContent}
        </main>
        ${renderBottomNav()}
        ${renderModals()}
        ${uiState.toastMessage ? `
          <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap">
            ${uiState.toastMessage}
          </div>
        ` : ''}
      `;
    }

    render();
  </script>
</body>
</html>
